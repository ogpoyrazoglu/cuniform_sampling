#===============================================================================
# Experiment Configuration (shared across controllers)
#===============================================================================
# Determines the source of perception data for all controllers
# Options: "lidar" (simulates sensor), "ground_truth" (perfect local map)
# perception_mode: "ground_truth"
perception_mode: "lidar"

controllers_to_test:
  - "CFU_MPPI" # C-Free-Uniform MPPI
  - "CFU_LOGMPPI"
  - "CU_MPPI"
  - "CU_LOGMPPI"
  - "MPPI"
  - "LOGMPPI"
  # - "cuniform_map_conditioned"
  # - "cuniform_unsupervised_openspace"
  # - "mppi"
  # - "log_mppi"

# global map parameters
global_map_resolution: 0.05   # global map grid resolution (meters/cell)
# global_origin: [-0.5, -2.25]  
global_origin: [0.0, 0.0]   # NOTE: make sure this is set to 0, 0 for polygon environments

