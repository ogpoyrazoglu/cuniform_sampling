  # Define a base set of parameters for DumbbellSweep and BudgetSweep experiments
  base_dumbbell_params: &base_dumbbell_params # dataset is generated on the fly
    # Overall map dimensions [width, height] in grid cells.
    map_size_cells: [300, 120]
    # Width of the rectangular rooms on either side of the bottleneck, in grid cells.
    room_width_cells: 70

    # A list of NAVIGABLE FREE SPACE widths to test (in grid cells).
    # A width of 'W' creates a map with a W-cell wide gap between walls.
